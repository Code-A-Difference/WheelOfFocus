<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Classroom Brain Break Randomizer</title>
    <style>
        :root {
            --primary: #6366f1;
            --success: #00f5d4;
            --winner-glow: #00ff66;
            --dark: #0f172a;
            --light: #f8fafc;
            --panel-bg: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a1a2e 0%, #080810 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: var(--light);
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 5px 0;
            background: linear-gradient(45deg, #00f5d4, #f72585, #7209b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            font-weight: 800;
            letter-spacing: -1px;
            animation: titleGlow 3s ease infinite alternate;
        }

        @keyframes titleGlow {
            0% { filter: drop-shadow(0 0 2px rgba(0,245,212,0.2)); }
            100% { filter: drop-shadow(0 0 15px rgba(247,37,133,0.5)); }
        }

        .subtitle {
            font-size: 1.2rem;
            margin: 0;
            color: #94a3b8;
            font-weight: 400;
        }

        .audio-toggle-container {
            margin-top: 15px;
        }

        .audio-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid #334155;
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .audio-btn.sound-on {
            border-color: #00f5d4;
            color: #00f5d4;
            box-shadow: 0 0 10px rgba(0, 245, 212, 0.2);
        }

        .app-container {
            display: flex;
            flex-wrap: wrap;
            gap: 50px;
            align-items: center;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        .wheel-wrapper {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arrow {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #f72585;
            z-index: 10;
            filter: drop-shadow(0px 4px 12px rgba(247, 37, 133, 0.7));
            transform-origin: 50% 0%;
        }

        .arrow.tick-snap {
            animation: arrowSnap 0.12s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes arrowSnap {
            0% { transform: translateX(-50%) rotate(0deg); }
            40% { transform: translateX(-50%) rotate(-18deg); }
            100% { transform: translateX(-50%) rotate(0deg); }
        }

        #wheel-svg {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.7), 0 0 0 12px #202038;
            transition: transform 5.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .target-glow-active {
            animation: smoothGreenGlow 2s ease-in-out infinite alternate !important;
            opacity: 1 !important;
        }

        @keyframes smoothGreenGlow {
            0% {
                fill: var(--winner-glow);
                filter: drop-shadow(0 0 5px rgba(0,255,102,0.6));
            }
            100% {
                fill: #00b344;
                filter: drop-shadow(0 0 25px rgba(0,255,102,0.9));
            }
        }

        .display-panel {
            flex: 1;
            min-width: 380px;
            max-width: 520px;
            background: var(--panel-bg);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 540px;
            justify-content: center;
            box-sizing: border-box;
            border: 3px solid #334155;
            transition: all 0.4s ease;
        }

        .panel-active {
            border-color: #00f5d4;
            box-shadow: 0 0 40px rgba(0, 245, 212, 0.25);
            animation: panelPulse 2s infinite alternate;
        }

        @keyframes panelPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.01); }
        }

        #spin-btn {
            padding: 18px 60px;
            font-size: 1.6rem;
            font-weight: 800;
            color: white;
            background: linear-gradient(135deg, #f72585 0%, #7209b7 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(247, 37, 133, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        #spin-btn:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 15px 30px rgba(247, 37, 133, 0.6);
        }

        #spin-btn:disabled {
            background: #475569;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        #instruction-card {
            width: 100%;
            display: none;
        }

        #instruction-card.show {
            display: block;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(40px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .activity-title {
            font-size: 2rem;
            color: #00f5d4;
            margin: 0 0 20px 0;
            text-align: center;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 245, 212, 0.3);
        }

        .visual-guide-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .activity-svg-frame {
            width: 190px;
            height: 190px;
            background: #0f172a;
            border-radius: 24px;
            border: 2px solid #334155;
            padding: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .activity-svg-frame svg {
            width: 100%;
            height: 100%;
        }

        .steps-list {
            background: #0f172a;
            padding: 25px 25px 25px 45px;
            border-radius: 20px;
            margin: 0;
            font-size: 1.1rem;
            line-height: 1.7;
            color: #cbd5e1;
            border: 1px solid #1e293b;
        }

        .steps-list li {
            margin-bottom: 12px;
            animation: slideInStep 0.4s ease forwards;
            opacity: 0;
            transform: translateX(-20px);
        }

        @keyframes slideInStep {
            to { opacity: 1; transform: translateX(0); }
        }

        .steps-list li::marker {
            color: #f72585;
            font-weight: bold;
        }

        .placeholder-text {
            font-size: 1.4rem;
            color: #64748b;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>🧠 Ultimate Brain Break Wheel</h1>
        <div class="subtitle">Quick energy resets for the classroom</div>
        <div class="audio-toggle-container">
            <button id="audio-toggle" class="audio-btn sound-on" onclick="toggleMute()">
                <span id="audio-icon">🔊</span> Sound Effects On
            </button>
        </div>
    </div>

    <div class="app-container">
        <div class="wheel-wrapper">
            <div class="arrow" id="spinner-arrow"></div>
            <svg id="wheel-svg" viewBox="0 0 500 500">
                <g id="wheel-group"></g>
                <circle cx="250" cy="250" r="32" fill="#0f172a" stroke="#00f5d4" stroke-width="5" filter="drop-shadow(0 0 10px rgba(0,245,212,0.6))"/>
                <circle cx="250" cy="250" r="8" fill="#ffffff"/>
            </svg>
        </div>

        <div class="display-panel" id="side-panel">
            <button id="spin-btn" onclick="spinWheel()">SPIN THE WHEEL!</button>
            
            <div id="placeholder" class="placeholder-text">
                Ready to move?<br>Click spin to pick an exercise!
            </div>

            <div id="instruction-card">
                <div class="activity-title" id="act-title">🧘 Mindfulness Flow</div>
                <div class="visual-guide-container" id="visual-guide"></div>
                <ol class="steps-list" id="act-steps"></ol>
            </div>
        </div>
    </div>

    <script>
        const activities = [
            {
                title: "🌳 Tree Pose Stretch",
                label: "🌳 Tree Pose",
                color: "#ff007f",
                svgRaw: `<svg viewBox="0 0 100 100" fill="none" stroke="#00f5d4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="50" y1="80" x2="50" y2="38" stroke-width="6"/>
                    <circle cx="50" cy="24" r="7" fill="#ff007f" stroke="none"/>
                    <path d="M50 38 Q35 30 42 14 Q50 8 50 8 Q50 8 58 14 Q65 30 50 38" />
                    <path d="M50 56 L32 63 L50 70" />
                    <line x1="25" y1="80" x2="75" y2="80" stroke="#6366f1" stroke-width="6"/>
                </svg>`,
                steps: [
                    "Stand perfectly tall and stable on your left leg.",
                    "Bend your right knee and place the bottom of your right foot flat against your ankle or inner leg.",
                    "Reach both hands up high above your head like growing tree branches.",
                    "Hold still and take 3 deep, quiet breaths."
                ]
            },
            {
                title: "🕺 Galactic Dance Party",
                label: "🕺 Dance Party",
                color: "#7209b7",
                svgRaw: `<svg viewBox="0 0 100 100" fill="none" stroke="#9d4edd" stroke-width="5" stroke-linecap="round">
                    <circle cx="50" cy="20" r="7" fill="#00f5d4" stroke="none"/>
                    <line x1="50" y1="27" x2="50" y2="55" stroke-width="6"/>
                    <path d="M50 35 L25 18 L15 35" />
                    <path d="M50 35 L75 25 L85 10" />
                    <path d="M50 55 L35 72 L20 85" />
                    <path d="M50 55 L65 72 L80 65" />
                </svg>`,
                steps: [
                    "Stand up completely in your own desk area footprint.",
                    "Show off your absolute best dynamic dance moves for 20 seconds!",
                    "Keep your hands waving out wide but keep your feet planted.",
                    "Freeze instantly in place when the timer runs down."
                ]
            },
            {
                title: "🦅 Mighty Eagle Stretch",
                label: "🦅 Eagle Stretch",
                color: "#3a0ca3",
                svgRaw: `<svg viewBox="0 0 100 100" fill="none" stroke="#4cc9f0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="50" cy="16" r="6" fill="#4cc9f0" stroke="none"/>
                    
                    <path d="M50 22 C48 32 46 42 45 48" stroke-width="6" />
                    <path d="M45 48 C36 54 36 64 45 70 C52 74 54 78 48 88" stroke-width="5" stroke="#4cc9f0" />
                    <path d="M45 48 C54 54 52 68 52 88" stroke-width="5" stroke="#22d3ee" stroke-dasharray="none" />

                    <path d="M45 28 C34 26 38 40 47 42 C51 43 51 32 51 24" />
                    <path d="M55 28 C66 26 62 40 53 42 C49 43 49 32 49 24" stroke="#22d3ee" />
                    
                    <line x1="25" y1="88" x2="75" y2="88" stroke="#6366f1" stroke-width="4"/>
                </svg>`,
                steps: [
                    "Stand tall and cross your right arm completely over your left arm.",
                    "Bend your elbows and try to press your palms flat together.",
                    "Slightly bend your knees and cross your right leg right over your left leg.",
                    "Squeeze your arms and legs gently, breathing smoothly."
                ]
            },
            {
                title: "🖐️ Cosmic Jumping Jacks",
                label: "🖐️ Jumping Jacks",
                color: "#4361ee",
                svgRaw: `<svg viewBox="0 0 100 100" fill="none" stroke="#4361ee" stroke-width="5" stroke-linecap="round">
                    <circle cx="50" cy="20" r="7" fill="#fff" stroke="none"/>
                    <line x1="50" y1="27" x2="50" y2="55" stroke-width="6"/>
                    <path d="M50 35 L20 15 M50 35 L80 15" />
                    <path d="M50 55 L25 85 M50 55 L75 85" />
                </svg>`,
                steps: [
                    "Make sure you have space on both sides of you.",
                    "Jump out wide with your feet while clapping your hands over your head.",
                    "Jump back in to stand straight with your arms by your side.",
                    "Complete 10 high-energy jumping jacks together!"
                ]
            },
            {
                title: "⚔️ Brave Warrior Stretch",
                label: "⚔️ Warrior Stretch",
                color: "#4cc9f0",
                svgRaw: `<svg viewBox="0 0 100 100" fill="none" stroke="#00f5d4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="45" cy="22" r="7" fill="#7209b7" stroke="none"/>
                    <line x1="45" y1="29" x2="45" y2="52" stroke-width="6"/>
                    <path d="M45 35 H15 M45 35 H80" />
                    <path d="M45 52 L20 58 L15 85 M45 52 L75 52 L90 85" />
                </svg>`,
                steps: [
                    "Step your feet out wide apart and turn your right foot out.",
                    "Bend your front knee forward into a deep, strong, controlled lunge.",
                    "Extend both arms out straight to your sides, completely flat to the floor.",
                    "Look straight out past your front fingertips and hold your balance!"
                ]
            },
            {
                title: "🤫 Complete Focus Ice Statue",
                label: "🤫 Ice Statue",
                color: "#f72585",
                svgRaw: `<svg viewBox="0 0 100 100" fill="none" stroke="#f72585" stroke-width="5" stroke-linecap="round">
                    <circle cx="50" cy="22" r="7" fill="#f72585" stroke="none"/>
                    <line x1="50" y1="29" x2="50" y2="58" stroke-width="6"/>
                    <path d="M50 38 H25 V55 M50 38 H75 V55" />
                    <path d="M50 58 L38 85 M50 58 L62 85" />
                </svg>`,
                steps: [
                    "Freeze immediately exactly where you are sitting or standing.",
                    "No shifting, talking, or moving an eyelash allowed.",
                    "Take soft, quiet breaths and listen to the silence of the room.",
                    "Hold your focus for 15 seconds until the bell unlocks you."
                ]
            },
            {
                title: "💃 The Macarena Slide",
                label: "💃 Macarena Slide",
                color: "#00f5d4",
                svgRaw: `<svg viewBox="0 0 100 100" fill="none" stroke="#00f5d4" stroke-width="5" stroke-linecap="round">
                    <circle cx="50" cy="22" r="7" fill="#f72585" stroke="none"/>
                    <line x1="50" y1="29" x2="50" y2="55" stroke-width="6"/>
                    <line x1="50" y1="36" x2="15" y2="36" />
                    <line x1="50" y1="44" x2="18" y2="44" />
                    <path d="M50 55 L40 85 M50 55 L60 85" />
                </svg>`,
                steps: [
                    "Extend your right arm straight out forward, then your left arm forward.",
                    "Flip your right palm up, then your flip your left palm up.",
                    "Cross your right hand to your left shoulder, then left hand to right shoulder.",
                    "Jump up, turn 90 degrees to the left, clap, and repeat!"
                ]
            },
            {
                title: "🤖 Funky Robot Freeze",
                label: "🤖 Robot Freeze",
                color: "#f15bb5",
                svgRaw: `<svg viewBox="0 0 100 100" fill="none" stroke="#f15bb5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="42" y="10" width="16" height="14" rx="2" fill="#00f5d4" stroke="none"/>
                    <rect x="35" y="28" width="30" height="28" rx="4"/>
                    <path d="M35 35 H15 V15 M65 42 H85 V65" />
                    <path d="M42 56 V85 M58 56 V85" stroke-width="6"/>
                </svg>`,
                steps: [
                    "Move your arms stiffly like a robot using only sharp, mechanical 90-degree angles.",
                    "Step side-to-side while making robot sounds for 10 seconds.",
                    "When the imaginary power switch turns off, lock perfectly rigid.",
                    "Hold your mechanical robot pose completely still until your engine restarts!"
                ]
            }
        ];

        const totalSegments = activities.length;
        const degreesPerSegment = 360 / totalSegments;
        const wheelSvg = document.getElementById('wheel-svg');
        const wheelGroup = document.getElementById('wheel-group');
        const spinBtn = document.getElementById('spin-btn');
        const arrowEl = document.getElementById('spinner-arrow');
        const placeholder = document.getElementById('placeholder');
        const insCard = document.getElementById('instruction-card');
        const actTitle = document.getElementById('act-title');
        const actSteps = document.getElementById('act-steps');
        const visualGuide = document.getElementById('visual-guide');
        const sidePanel = document.getElementById('side-panel');
        const audioBtn = document.getElementById('audio-toggle');
        const audioIcon = document.getElementById('audio-icon');

        let currentRotation = 0;
        let audioCtx;
        let isMuted = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            if (isMuted) {
                audioBtn.classList.remove('sound-on');
                audioIcon.textContent = "🔇";
                audioBtn.childNodes[2].nodeValue = " Sound Effects Off";
            } else {
                audioBtn.classList.add('sound-on');
                audioIcon.textContent = "🔊";
                audioBtn.childNodes[2].nodeValue = " Sound Effects On";
            }
        }

        function playClickSound() {
            if (isMuted || !audioCtx || audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(380, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        function playSuccessSound() {
            if (isMuted || !audioCtx) return;
            const now = audioCtx.currentTime;
            const scheduleChimeNote = (freq, startTime, duration, volume) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + startTime);
                gain.gain.setValueAtTime(0, now + startTime);
                gain.gain.linearRampToValueAtTime(volume, now + startTime + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.001, now + startTime + duration);
                osc.start(now + startTime);
                osc.stop(now + startTime + duration);
            };
            scheduleChimeNote(440.00, 0, 0.4, 0.06);    
            scheduleChimeNote(554.37, 0.05, 0.4, 0.06); 
            scheduleChimeNote(659.25, 0.10, 0.4, 0.06); 
            scheduleChimeNote(880.00, 0.15, 0.7, 0.08); 
        }

        function coordinatesFromDegrees(centerX, centerY, radius, angleInDegrees) {
            const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
            return {
                x: centerX + (radius * Math.cos(angleInRadians)),
                y: centerY + (radius * Math.sin(angleInRadians))
            };
        }

        function buildSvgWheel() {
            activities.forEach((act, index) => {
                const startAngle = index * degreesPerSegment;
                const endAngle = startAngle + degreesPerSegment;
                
                const startCoords = coordinatesFromDegrees(250, 250, 240, startAngle);
                const endCoords = coordinatesFromDegrees(250, 250, 240, endAngle);
                const largeArcFlag = degreesPerSegment <= 180 ? "0" : "1";

                const pathData = `
                    M 250,250
                    L ${startCoords.x},${startCoords.y}
                    A 240,240 0 ${largeArcFlag},1 ${endCoords.x},${endCoords.y}
                    Z
                `;

                const pathEl = document.createElementNS("http://www.w3.org/2000/svg", "path");
                pathEl.setAttribute("d", pathData);
                pathEl.setAttribute("fill", act.color);
                pathEl.setAttribute("stroke", "#0f172a");
                pathEl.setAttribute("stroke-width", "5");
                pathEl.setAttribute("opacity", "0.9");
                pathEl.setAttribute("id", `slice-${index}`); 
                wheelGroup.appendChild(pathEl);

                const textEl = document.createElementNS("http://www.w3.org/2000/svg", "text");
                const midAngle = startAngle + (degreesPerSegment / 2);
                const textCoords = coordinatesFromDegrees(250, 250, 155, midAngle);
                
                textEl.setAttribute("x", textCoords.x);
                textEl.setAttribute("y", textCoords.y);
                textEl.setAttribute("fill", "#ffffff");
                textEl.setAttribute("font-size", "14px");
                textEl.setAttribute("font-weight", "900");
                textEl.setAttribute("text-anchor", "middle");
                textEl.setAttribute("transform", `rotate(${midAngle + 180}, ${textCoords.x}, ${textCoords.y})`);
                textEl.setAttribute("style", "text-shadow: 1px 1px 2px rgba(0,0,0,0.8); pointer-events: none;");
                textEl.textContent = act.label;
                
                wheelGroup.appendChild(textEl);
            });
        }

        function spinWheel() {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            
            activities.forEach((_, idx) => {
                document.getElementById(`slice-${idx}`).classList.remove('target-glow-active');
            });

            spinBtn.disabled = true;
            sidePanel.classList.remove('panel-active');
            insCard.classList.remove('show');
            placeholder.style.display = 'block';
            placeholder.textContent = "Locking onto sequence...";

            const totalRotations = 8 + Math.floor(Math.random() * 4); 
            const randomTargetOffset = Math.floor(Math.random() * 360);
            const absoluteSpinAmount = (totalRotations * 360) + randomTargetOffset;
            
            currentRotation += absoluteSpinAmount;
            wheelSvg.style.transform = `rotate(${currentRotation}deg)`;

            let lastTrackedAngle = 0;
            const startTime = performance.now();
            const totalDuration = 5500; 

            function easeOutCubic(x) {
                return 1 - Math.pow(1 - x, 3);
            }

            function trackTicks() {
                const now = performance.now();
                const elapsed = now - startTime;
                
                if (elapsed >= totalDuration) return;

                const progress = elapsed / totalDuration;
                const easedProgress = easeOutCubic(progress);
                const currentAngleProgress = easedProgress * absoluteSpinAmount;

                if (Math.floor(currentAngleProgress / degreesPerSegment) > Math.floor(lastTrackedAngle / degreesPerSegment)) {
                    playClickSound();
                    arrowEl.classList.remove('tick-snap');
                    void arrowEl.offsetWidth; 
                    arrowEl.classList.add('tick-snap');
                }

                lastTrackedAngle = currentAngleProgress;
                requestAnimationFrame(trackTicks);
            }
            
            requestAnimationFrame(trackTicks);

            setTimeout(() => {
                const finalWrappedDegree = (360 - (currentRotation % 360)) % 360;
                const activeIndex = Math.floor(finalWrappedDegree / degreesPerSegment);
                const selection = activities[activeIndex];

                document.getElementById(`slice-${activeIndex}`).classList.add('target-glow-active');

                actTitle.innerHTML = selection.title;
                visualGuide.innerHTML = `<div class="activity-svg-frame">${selection.svgRaw}</div>`;
                
                actSteps.innerHTML = selection.steps.map((step, i) => 
                    `<li style="animation-delay: ${i * 0.15}s">${step}</li>`
                ).join('');

                placeholder.style.display = 'none';
                insCard.classList.add('show');
                sidePanel.classList.add('panel-active');
                
                playSuccessSound();
                spinBtn.disabled = false;
            }, totalDuration);
        }

        buildSvgWheel();
    </script>
</body>
</html>
